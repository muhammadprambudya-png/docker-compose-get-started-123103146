include:
  - path: ./infra.yaml

services:
  web:
    build: ./app
    ports:
      - "${APP_PORT}:5000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /code
        - action: rebuild
          path: ./app/requirements.txt
